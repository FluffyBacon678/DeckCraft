# ============================================================================
# DeckCraft Hotbar — Fabric mod Gradle properties
# ============================================================================
# Values VERIFIED against meta.fabricmc.net and the official Fabric 1.21.11
# announcement (fabricmc.net/2025/12/05/12111.html), May 2026.
#
# IMPORTANT CONTEXT: 1.21.11 (released 2025-12-09) is the LAST obfuscated and the
# LAST Yarn-mapped Minecraft version. Yarn build.6 exists, so this project uses
# Yarn as requested. If you ever move to 26.1+, you must switch to Mojang mappings
# and the net.fabricmc.fabric-loom (non-remap) plugin id.
# ============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Minecraft + mappings (Yarn) -----------------------------------------
minecraft_version=1.21.11
# Yarn 1.21.11+build.6 is the latest stable build (confirmed on meta.fabricmc.net).
yarn_mappings=1.21.11+build.6

# --- Fabric ---------------------------------------------------------------
# Loom: official guidance for 1.21.11 is Loom 1.14. The legacy 'fabric-loom'
# plugin id still works for obfuscated versions like 1.21.11.
loom_version=1.14-SNAPSHOT
# Loader: 0.19.2 is the latest stable for 1.21.11 (meta.fabricmc.net).
loader_version=0.19.2
# Fabric API: 0.139.5+1.21.11 is a stable post-release build. Latest is 0.141.4+1.21.11
# if you want to bump it; this MVP only needs the (very stable) client lifecycle modules.
fabric_version=0.139.5+1.21.11

# --- Mod metadata ---------------------------------------------------------
mod_version=0.1.0
maven_group=com.fluffybacon.deckcraft
archives_base_name=deckcraft-hotbar
